[project]
name = "ktl-flow-pi"
version = "0.1.0"
description = "A-1 접수대 라즈베리파이 — 기기 검색 · 접수번호 · QR"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "segno>=1.6",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
]

[project.optional-dependencies]
# opencv: QR 그림을 다시 읽어 보는 테스트용 (제품 코드에서는 안 씀)
dev = ["pytest>=8", "httpx>=0.27", "opencv-python-headless>=4.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
