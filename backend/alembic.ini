[alembic]
script_location = migrations
# The real URL is set by app/db.py from PI_DB (default: backend/data/pi.db). Keep this file ASCII: alembic reads it with the OS locale (cp949 on Windows).
sqlalchemy.url = sqlite:///data/pi.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARN
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
